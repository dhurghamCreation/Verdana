    <script>
      (function() {
        // Intercept and swallow sandbox Vite HMR WebSocket connection noise in sandboxed iframe
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String(a || ''); }).join(' ');
          if (
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            (str.indexOf('[vite]') !== -1 && str.indexOf('websocket') !== -1)
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String(a || ''); }).join(' ');
          if (
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || '');
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('[vite]') !== -1)) {
            event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason ? String(event.reason) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1) {
            event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);
      })();
    </script>

  </body>
